<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"> -->
  <title>Login and Registration</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f2f2f2;
      justify-content: space-between;
      background-size: cover;
    }

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background-color:#0c6493;
    padding:10px 20px;
    width:100%;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

/* Logo section */

.logo{
    display:flex;
    align-items:center;
}

.logo img{
    width:50px;
    height:40px;
}

.logo h1{
    margin-left:10px;
    color:#e5dfdf;
    font-size:22px;      /* fixed size */
    font-weight:bold;
    white-space:nowrap;
    margin-top:0;
    margin-bottom:0;
}

/* Navigation links */

.nav-links{
    display:flex;
    align-items:center;
    gap:18px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:16px;      /* constant menu size */
    font-weight:500;
    padding:8px 12px;
    white-space:nowrap;
    font-family:Arial, Helvetica, sans-serif;
}

.nav-links a:hover{
    color:lightgray;
}

/* Menu icon for mobile */

.menu-icon{
    display:none;
    cursor:pointer;
}

.bar{
    width:25px;
    height:3px;
    background:white;
    margin:5px 0;
}


   /* DESKTOP LOGIN DESIGN */
.box-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    width: 90%;
    margin-top: 20px;
}

.card {
    background: rgba(255, 255, 255, 0.95);
    padding: 35px;
    border-radius: 18px;
    width: 450px;
    min-height: 320px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    backdrop-filter: blur(8px);
    transition: 0.3s ease;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 45px rgba(0,0,0,0.35);
}

.card h3 {
    text-align: center;
    font-size: 32px;
    color: #0c6493;
    margin-bottom: 30px;
}

/* FORM GROUP */
.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
}

/* INPUT */
.form-control {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border: 2px solid #d1d5db;
    border-radius: 10px;
    outline: none;
    transition: 0.3s;
    box-sizing: border-box;
}

.form-control:focus {
    border-color: #0c6493;
    box-shadow: 0 0 12px rgba(12,100,147,0.2);
}

/* BUTTON */
.btn {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    font-weight: 600;
    background: linear-gradient(135deg, #0c6493, #1e88e5);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(12,100,147,0.3);
}

/* CONTAINER */
.container {
    height: calc(100vh - 70px);
    display: flex;
    justify-content: center;
    align-items: center;
    background-position: center;
}

    /* Media query for smaller screens */
    @media only screen and (max-width: 768px) {

  body {
    overflow-x: hidden;
  }

  /* NAVBAR */
  .navbar {
    flex-direction: column;
    align-items: flex-start;
    padding: 12px 15px;
    position: relative;
  }

  .logo {
    display: flex;
    align-items: center;
    width: 100%;
  }

  .logo img {
    width: 45px;
    height: 35px;
  }

  .logo h1 {
    font-size: 18px;
    margin-left: 10px;
    white-space: normal;
  }

  .menu-icon {
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: absolute;
    right: 15px;
    top: 18px;
    cursor: pointer;
  }

  .bar {
    width: 28px;
    height: 3px;
    background: white;
    border-radius: 5px;
    margin: 0;
  }

  .nav-links {
    display: none;
    flex-direction: column;
    width: 100%;
    background: #0c6493;
    margin-top: 15px;
    border-radius: 10px;
    overflow: hidden;
  }

  .nav-links a {
    width: 100%;
    text-align: center;
    padding: 14px;
    color: white;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }

  .show-nav {
    display: flex;
  }

  /* MAIN CONTAINER */
  .container {
    height: auto;
    min-height: 100vh;
    padding: 30px 15px;
    background-position: center;
  }

  /* FORM STACK */
  .box-container {
    flex-direction: column;
    align-items: center;
    width: 100%;
    margin-top: 0;
    gap: 20px;
  }

  .card {
    width: 100%;
    max-width: 400px;
    padding: 20px;
    border-radius: 15px;
  }

  .card h3 {
    text-align: center;
    font-size: 22px;
  }

  /* INPUTS */
  .form-group {
    margin-bottom: 15px;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 600;
  }

  .form-control {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
  }

  /* BUTTONS */
  .btn {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #0c6493;
    color: white;
    cursor: pointer;
  }
}
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <img src="https://tse4.mm.bing.net/th?id=OIP.m98o3yW6eMNLtZE5A9-QtQHaHa&pid=Api&P=0&h=180">
      <h1>Flood Monitoring System</h1>
    </div>

    <div class="menu-icon" onclick="toggleNav()">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="Realtime records.html">Realtime Records</a>
      <a href="location.html">Location</a>
      <a href="contact.html">Contact Us</a>
      <a href="Graphs.html">Trend Graph</a>
      <a href="weather.html">Weather</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <div class="container">
    <div class="box-container">
      <div class="card">
        <h3>Register</h3>
        <form name="registration_form" id="registration_form" method="post" action="#" enctype="multipart/form-data">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="text" name="email" id="email" class="form-control" placeholder="Enter your email">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password">
          </div>
          <button type="button" id="register" name="register" class="btn btn-success">Register Now</button>
        </form>
      </div>

      <div class="card">
        <h3>Login</h3>
        <form name="login_form" id="login_form" method="post" action="#" enctype="multipart/form-data">
          <div class="form-group">
            <label for="login_email">Email</label>
            <input type="text" name="login_email" id="login_email" class="form-control" placeholder="Enter your email">
          </div>

          <div class="form-group">
            <label for="login_password">Password</label>
            <input type="password" name="login_password" id="login_password" class="form-control" placeholder="Enter your password">
          </div>
          <button type="button" id="login" name="login" class="btn btn-success">Login</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.10.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.10.0/firebase-analytics.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut} from "https://www.gstatic.com/firebasejs/9.10.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyApYb8uDfLDh4oI1M5eLOZV_dCcG_-CKG0",
      authDomain: "flood-alertation.firebaseapp.com",
      projectId: "flood-alertation",
      storageBucket: "flood-alertation.appspot.com",
      messagingSenderId: "69631384712",
      appId: "1:69631384712:web:36c9476b34f08c8d2e933d",
      measurementId: "G-J5CQMECBMS"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth();
    console.log(app);

    document.getElementById("register").addEventListener("click", function() {
      var email = document.getElementById("email").value;
      var password = document.getElementById("password").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          console.log(user);
          alert("Registration successful!!");
        })
        .catch((error) => {
          const errorMessage = error.message;
          console.log(errorMessage);
          alert(errorMessage);
        });
    });

    document.getElementById("login").addEventListener("click", function() {
      var email = document.getElementById("login_email").value;
      var password = document.getElementById("login_password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          console.log(user);
          alert(user.email + " logged in successfully!!!");
        })
        .catch((error) => {
          const errorMessage = error.message;
          console.log(errorMessage);
          alert(errorMessage);
        });
    });
  </script>
</body>
</html>
